name: Bot CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.build.outputs.image-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        id: build
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/bolt
          TAG=${{ github.sha }}
          docker build -t $IMAGE:$TAG -f Dockerfile .
          echo "image-tag=$TAG" >> $GITHUB_OUTPUT

      - name: Push Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/bolt
          TAG=${{ steps.build.outputs.image-tag }}
          docker push $IMAGE:$TAG

  deploy:
    needs: build_and_test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG_BASE64 }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl set image deploy/bolt-deploy bolt=ghcr.io/${{ github.repository_owner }}/bolt:${{ needs.build_and_test.outputs.image-tag }}
          kubectl rollout status deployment/bolt-deploy
